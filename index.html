<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<title>ระบบวิชาเรียน</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#f4f5f8; --surface:#fff; --ink:#1d2433; --muted:#6b7385; --line:#e3e6ee; --brand:#4f6bed; --brand-ink:#fff;
  --P:#1f9d55; --L:#d99a06; --M:#e0661b; --S:#3b82c4; --B:#5a8fd6; --E:#8b5cc7; --A:#d33d3d; --N:#c3c8d4;
  --radius:14px; --shadow:0 1px 2px rgba(20,30,60,.06),0 2px 8px rgba(20,30,60,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:1200px;margin:0 auto;padding:0 12px 80px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 8px;display:flex;align-items:center;gap:8px}
.top h1{font-size:18px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.btn.dan{color:var(--A);border-color:#f0c4c4}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:32px;padding:4px 10px;font-size:14px}
.btn.big{min-height:52px;font-size:18px;padding:10px 20px;width:100%;justify-content:center}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:none;background:transparent;padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:500}
.tab.on{background:var(--ink);color:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:13px;background:#eef0f5;border:1px solid transparent;cursor:pointer;white-space:nowrap}
.chip.on{border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
input[type=text],input[type=password],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
textarea{min-height:120px;resize:vertical}
label.f{display:block;margin:10px 0 4px;font-size:14px;color:var(--muted)}
.list .it{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:none}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 16px;border-radius:12px;z-index:100;max-width:90vw;font-size:15px}
.sync{position:fixed;right:12px;bottom:12px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;z-index:50;box-shadow:var(--shadow)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,20,35,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 20px}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:18px}}
.sheet h3{margin:0 0 8px;font-size:18px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:8px 0}
.opt{border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;background:#fff;font-weight:600}
.opt .dot{margin-right:6px}
/* board */
.bar{position:sticky;top:52px;z-index:15;background:var(--bg);padding-bottom:6px}
.clock{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:12px;padding:8px 12px;color:#fff;margin:4px 0 8px}
.clock .t{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.clock.ph0{background:#6b7385}.clock.ph1{background:var(--P)}.clock.ph2{background:var(--L)}.clock.ph3{background:var(--M)}.clock.done{background:#3a4152}
.clock .btn{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;user-select:none;-webkit-user-select:none}
@media(min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}}
.sc{position:relative;background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:8px 6px 6px;text-align:center;cursor:pointer;border:3px solid var(--N);min-height:96px;display:flex;flex-direction:column;justify-content:space-between;touch-action:manipulation;transition:transform .08s}
.sc:active{transform:scale(.96)}
.sc .no{position:absolute;top:4px;left:6px;font-size:12px;color:var(--muted);font-weight:600}
.sc .pt{position:absolute;top:3px;right:5px;font-size:12px;font-weight:700}
.sc .nk{font-size:18px;font-weight:700;margin-top:10px;line-height:1.1;word-break:break-word}
.sc .fn{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .st{font-size:13px;font-weight:700;border-radius:8px;padding:2px 0;margin-top:4px;color:#fff;background:var(--N)}
.sc .ic{position:absolute;bottom:30px;right:5px;font-size:11px}
.sc.hide{display:none}
.sc.hl{outline:4px solid #ffcc00;transform:scale(1.06);z-index:2}
.sc.dim{opacity:.35}
.pickbig{font-size:44px;font-weight:800;text-align:center;margin:12px 0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}
.tbl th:nth-child(2),.tbl td:nth-child(2){text-align:left}
.tbl tr.risk td{background:#fff1f1}
.scroll{overflow-x:auto}
.qrbox{background:#fff;padding:12px;border-radius:16px;display:inline-block}
.qrfull{position:fixed;inset:0;background:#fff;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center}
.qrfull .big{font-size:28px;font-weight:700}
.pin{font-size:32px;letter-spacing:12px;text-align:center}
.res{text-align:center;padding:40px 10px}
.res .ok{width:120px;height:120px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:64px;color:#fff}
.pre{white-space:pre-wrap;line-height:1.6}
.pill{border-radius:8px;padding:2px 8px;color:#fff;font-size:13px;font-weight:600}
.bar-pct{height:8px;border-radius:4px;background:#eef0f5;overflow:hidden;margin-top:6px}
.bar-pct>i{display:block;height:100%}
@media print{.noprint{display:none!important}.qrfull{position:static}}
</style>
</head>
<body>
<div id="app"><div class="empty">กำลังโหลด…</div></div>
<script>
var BOOT = (function(){var p={};new URLSearchParams(location.search).forEach(function(v,k){p[k]=v;});return {params:p,baseUrl:location.origin+location.pathname,version:'0.3.0',api:'https://script.google.com/macros/s/AKfycbwJjOJp0OKYQVFpQxBgkEW4CaBljMh7VW29Ud86LD6Hr0K6Px2lrL1_aYtT9aBRZ1na2g/exec'};})();
</script>
<script>
/* ===================== Utilities ===================== */
var P = BOOT.params || {};
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function app(html) { var a = $('#app'); a.innerHTML = html; window.scrollTo(0, 0); return a; }
function fmtT(ms) { return ms ? new Date(ms).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Bangkok' }) : ''; }
function fmtD(ms) { return ms ? new Date(ms).toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'Asia/Bangkok' }) : ''; }
function fmtDS(d) { if (!d) return ''; var p = d.split('-'); return fmtD(Date.UTC(+p[0], +p[1] - 1, +p[2], 5)); }
function mmss(ms) { ms = Math.max(0, ms); var s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
var toastT;
function toast(m, ms) { var t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); } t.textContent = m; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(function () { t.style.display = 'none'; }, ms || 2600); }
function errMsg(e) { return (e && e.message) ? e.message : String(e); }

var ST = {
  P: { t: 'มา', c: 'var(--P)' }, L: { t: 'สาย 1', c: 'var(--L)' }, M: { t: 'สาย 2', c: 'var(--M)' },
  S: { t: 'ลาป่วย', c: 'var(--S)' }, B: { t: 'ลากิจ', c: 'var(--B)' }, E: { t: 'กิจกรรม', c: 'var(--E)' },
  A: { t: 'ขาด', c: 'var(--A)' }, '': { t: 'ยังไม่เช็ค', c: 'var(--N)' }
};
var ST_ORDER = ['P', 'L', 'M', 'S', 'B', 'E', 'A'];
var GROUP_COLORS = ['#e6553a', '#2f8fdd', '#27a35a', '#d59b00', '#8b5cc7', '#d6457f', '#169c9c', '#7a6a48', '#5b6ee1', '#c25e00'];

/* ===================== API ===================== */
function call(name, args, token) {
  if (BOOT.api) {
    // หน้าเว็บที่วางนอก Google: เรียก API ด้วย fetch แบบไม่ส่งคุกกี้บัญชี Google
    return fetch(BOOT.api, {
      method: 'POST', credentials: 'omit', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ name: name, args: args || {}, token: token || null })
    }).then(function (r) { return r.json(); }, function () { throw new Error('เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่'); })
      .then(function (j) { if (!j.ok) throw new Error(j.error); return j.res; });
  }
  return new Promise(function (res, rej) {
    google.script.run.withSuccessHandler(res).withFailureHandler(rej).api(name, args || {}, token || null);
  });
}
var S = { tTok: ls('tTok'), sTok: ls('sTok') };
function T(name, args) {
  return call(name, args, S.tTok).catch(function (e) {
    if (errMsg(e) === 'AUTH') { S.tTok = null; ls('tTok', null); tLogin(); }
    throw e;
  });
}
function SX(name, args) {
  return call(name, args, S.sTok).catch(function (e) {
    if (errMsg(e) === 'AUTH') { S.sTok = null; ls('sTok', null); }
    throw e;
  });
}
function link(params) { var q = Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&'); return BOOT.baseUrl + (q ? '?' + q : ''); }

/* ===================== Modal / forms ===================== */
function modal(html, onMount) {
  closeModal();
  var ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'ov';
  ov.innerHTML = '<div class="sheet">' + html + '</div>';
  ov.addEventListener('click', function (e) { if (e.target === ov) closeModal(); });
  document.body.appendChild(ov);
  if (onMount) onMount(ov.firstChild);
  return ov.firstChild;
}
function closeModal() { var o = $('#ov'); if (o) o.remove(); }
/* fields: [{k,label,type,value,options:[[v,t]],ph}] */
function form(title, fields, onSave, extraHtml) {
  var h = '<h3>' + esc(title) + '</h3>';
  fields.forEach(function (f) {
    var v = f.value == null ? '' : f.value;
    if (f.type === 'checkbox') { h += '<label class="row" style="margin:12px 0"><input type="checkbox" data-k="' + f.k + '"' + (v ? ' checked' : '') + ' style="width:22px;height:22px"> ' + esc(f.label) + '</label>'; return; }
    h += '<label class="f">' + esc(f.label) + '</label>';
    if (f.type === 'textarea') h += '<textarea data-k="' + f.k + '" placeholder="' + esc(f.ph || '') + '">' + esc(v) + '</textarea>';
    else if (f.type === 'select') h += '<select data-k="' + f.k + '">' + f.options.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(v) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>';
    else h += '<input type="' + (f.type || 'text') + '" data-k="' + f.k + '" value="' + esc(v) + '" placeholder="' + esc(f.ph || '') + '"' + (f.type === 'number' ? ' inputmode="numeric"' : '') + '>';
    if (f.hint) h += '<div class="sub">' + esc(f.hint) + '</div>';
  });
  h += (extraHtml || '') + '<div class="row" style="margin-top:16px"><button class="btn ghost grow" data-x="cancel">ยกเลิก</button><button class="btn pri grow" data-x="save">บันทึก</button></div>';
  modal(h, function (el) {
    var first = $('input,textarea', el); if (first && first.type !== 'checkbox') setTimeout(function () { first.focus(); }, 50);
    $('[data-x=cancel]', el).onclick = closeModal;
    $('[data-x=save]', el).onclick = function () {
      var out = {};
      $$('[data-k]', el).forEach(function (i) { out[i.dataset.k] = i.type === 'checkbox' ? i.checked : i.value.trim(); });
      var b = this; b.disabled = true; b.textContent = 'กำลังบันทึก…';
      Promise.resolve(onSave(out)).then(function (keep) { if (keep !== true) closeModal(); })
        .catch(function (e) { toast(errMsg(e)); b.disabled = false; b.textContent = 'บันทึก'; });
    };
  });
}
function confirmBox(title, text, okText, onOk, danger) {
  modal('<h3>' + esc(title) + '</h3><p>' + text + '</p><div class="row"><button class="btn ghost grow" data-x="c">ยกเลิก</button><button class="btn ' + (danger ? 'dan' : 'pri') + ' grow" data-x="o">' + esc(okText) + '</button></div>', function (el) {
    $('[data-x=c]', el).onclick = closeModal;
    $('[data-x=o]', el).onclick = function () { closeModal(); onOk(); };
  });
}

/* ===================== Background save queue ===================== */
var Q = { items: [], busy: false };
function enqueue(name, args, onDone, key) {
  Q.items.push({ name: name, args: args, onDone: onDone, key: key, tries: 0 });
  syncBadge(); pump();
}
function pending(key) { return Q.items.some(function (i) { return i.key === key; }); }
function pump() {
  if (Q.busy || !Q.items.length) { syncBadge(); return; }
  Q.busy = true; var it = Q.items[0];
  T(it.name, it.args).then(function (r) { Q.items.shift(); if (it.onDone) it.onDone(r); })
    .catch(function (e) {
      it.tries++;
      if (errMsg(e) === 'AUTH' || it.tries >= 6) { Q.items.shift(); toast('บันทึกไม่สำเร็จ: ' + errMsg(e)); }
      return sleep(1200 * it.tries);
    })
    .then(function () { Q.busy = false; pump(); });
}
function syncBadge() {
  var b = $('.sync');
  if (!Q.items.length) { if (b) b.remove(); return; }
  if (!b) { b = document.createElement('div'); b.className = 'sync'; document.body.appendChild(b); }
  b.textContent = '⟳ กำลังบันทึก ' + Q.items.length;
}
window.addEventListener('beforeunload', function (e) { if (Q.items.length) { e.preventDefault(); e.returnValue = ''; } });

/* ===================== Router ===================== */
var timers = [];
function clearTimers() { timers.forEach(function (t) { clearInterval(t); }); timers = []; }
function start() {
  if (P.p === 'teacher') return S.tTok ? tHome() : tLogin();
  if (P.p === 'j' && (P.r || P.c)) return sJoin(P.r || P.c, null); // ใช้ r เพราะ Apps Script สงวนชื่อ c
  if (P.p === 'c' && P.s) return sCheckinStart(P.s, P.t);
  if (S.sTok) return sHome();
  sLanding();
}

/* =========================================================
   ===================== TEACHER ===========================
   ========================================================= */
function tLogin() {
  clearTimers();
  app('<div class="card" style="max-width:420px;margin:60px auto"><h2 style="margin-top:0">ครู · เข้าสู่ระบบ</h2><div id="lg" class="sub">กำลังตรวจสอบ…</div></div>');
  call('teacherStatus').then(function (r) {
    $('#lg').innerHTML = (r.hasPassword ? '' : '<p>ครั้งแรก: ตั้งรหัสผ่านครู (อย่างน้อย 4 ตัว)</p>') +
      '<input type="password" id="pw" placeholder="รหัสผ่านครู"><div style="height:10px"></div><button class="btn pri big" id="go">' + (r.hasPassword ? 'เข้าสู่ระบบ' : 'ตั้งรหัสและเข้าสู่ระบบ') + '</button>';
    var go = function () {
      call('teacherLogin', { password: $('#pw').value }).then(function (x) { S.tTok = x.token; ls('tTok', x.token); tHome(); }).catch(function (e) { toast(errMsg(e)); });
    };
    $('#go').onclick = go; $('#pw').onkeydown = function (e) { if (e.key === 'Enter') go(); };
    $('#pw').focus();
  }).catch(function (e) { $('#lg').textContent = errMsg(e); });
}

var TH = null; // teacher home data
function loadHome() { return T('tHome').then(function (r) { TH = r; return r; }); }
function termName(id) { var t = (TH.terms || []).filter(function (x) { return x.id === id; })[0]; return t ? t.name : ''; }
function crName(id) { var c = TH.classrooms.filter(function (x) { return x.id === id; })[0]; return c ? c.name : '?'; }

function tHome() {
  clearTimers();
  app('<div class="top"><h1>ระบบวิชาเรียน</h1><button class="btn sm" onclick="tManage()">⚙ จัดการ</button></div><div id="body" class="empty">กำลังโหลด…</div>');
  loadHome().then(function (r) {
    var b = $('#body'); b.className = '';
    if (!r.terms.length) return quickSetup(b);
    var courses = r.courses.filter(function (c) { return c.termId === r.activeTermId; });
    var h = '<div class="sub">ภาคเรียน ' + esc(termName(r.activeTermId)) + '</div>';
    if (!courses.length) h += '<div class="card empty">ยังไม่มีรายวิชาในภาคเรียนนี้<br><br><button class="btn pri" onclick="tManage(\'courses\')">+ เพิ่มรายวิชา</button></div>';
    courses.forEach(function (c) {
      var secs = r.sections.filter(function (s) { return s.courseId === c.id; })
        .sort(function (a, b) { return crName(a.classroomId).localeCompare(crName(b.classroomId), 'th', { numeric: true }); });
      h += '<div class="card"><div class="row"><span class="dot" style="background:' + esc(c.color) + ';width:12px;height:12px"></span><b class="grow">' + esc(c.name) + '</b><span class="sub">' + esc(c.code) + '</span></div><div class="opts">';
      secs.forEach(function (s) {
        h += '<div class="opt" onclick="tSection(\'' + s.id + '\')">' + esc(crName(s.classroomId)) + (s.openSessionId ? '<div class="sub" style="color:var(--P)">● กำลังสอน</div>' : '') + '</div>';
      });
      h += '<div class="opt" style="font-weight:400;color:var(--muted)" onclick="addSections(\'' + c.id + '\')">+ เพิ่มห้อง</div></div></div>';
    });
    b.innerHTML = h;
  }).catch(function (e) { $('#body').textContent = errMsg(e); });
}

/* ตั้งค่าแบบเร็วครั้งแรก */
function quickSetup(el) {
  el.innerHTML = '<div class="card"><h3 style="margin-top:0">เริ่มต้นใช้งาน</h3><p class="sub">กรอก 3 ช่องนี้ ระบบจะสร้างภาคเรียน วิชา และห้องให้ทั้งหมด (แก้ไขภายหลังได้)</p>' +
    '<label class="f">ภาคเรียน</label><input type="text" id="q1" value="2/2569">' +
    '<label class="f">ชื่อวิชา (ถ้ามีหลายวิชา ใส่วิชาแรกก่อน)</label><input type="text" id="q2" placeholder="เช่น ดนตรี ม.1">' +
    '<label class="f">ห้องที่สอนวิชานี้ (คั่นด้วย , )</label><input type="text" id="q3" placeholder="เช่น ม.1/1, ม.1/2, ม.1/3">' +
    '<div style="height:12px"></div><button class="btn pri big" id="qs">สร้าง</button></div>';
  $('#qs').onclick = function () {
    var b = this; b.disabled = true; b.textContent = 'กำลังสร้าง…';
    var term, course;
    T('saveTerm', { name: $('#q1').value.trim(), active: true }).then(function (t) {

/* ---------- นาฬิกาเช็คชื่อ (แมนวล) ---------- */
function tickClock() {
  var el = $('#clock'); if (!el || !B.state || !sessionOpen()) return;
  var s = B.state.session, t = now();
  var html, cls;
  var l1 = (s.lateMinutes || 15) * 60000, l2 = (s.late2Minutes || 10) * 60000;
  if (!s.startAt) {
    cls = 'ph0';
    html = '<div class="grow">ยังไม่เริ่มจับเวลา <span class="sub" style="color:#fff">(เริ่มเองเมื่อเช็คคนแรก)</span></div><button class="btn sm" onclick="clockStart()">▶ เริ่มเช็คชื่อ</button>';
  } else {
    var el0 = t - s.startAt;
    var onEnd = s.onTimeEndAt || (s.startAt + l1);
    var phase = t <= onEnd ? 1 : (t > s.startAt + l2 ? 3 : 2);
    cls = 'ph' + phase;
    var label = phase === 1 ? 'รอบตรงเวลา' : phase === 2 ? 'ตอนนี้เช็ค = สาย 1' : 'ตอนนี้เช็ค = สาย 2';
    html = '<span class="t">' + mmss(el0) + '</span><div class="grow"><b>' + label + '</b><div style="font-size:13px">เริ่ม ' + fmtT(s.startAt) +
      (phase === 1 ? (s.onTimeEndAt ? '' : ' · ตัดรอบเองตอน ' + fmtT(onEnd)) : '') +
      (phase < 3 ? ' · สาย 2 ตั้งแต่ ' + fmtT(s.startAt + l2) : '') + '</div></div>' +
      (phase === 1 ? '<button class="btn sm" onclick="clockDone()">✓ เช็คเสร็จ</button>' :
        (s.boardCode ? '<button class="btn sm" onclick="boardShow()" title="ขึ้นรหัสบนจอ">รหัส <b style="font-size:18px;letter-spacing:2px">' + esc(s.boardCode) + '</b></button>' : '<button class="btn sm" onclick="boardNew(true)">เปิดรหัสบนกระดาน</button>') +
        (s.onTimeEndAt ? '<button class="btn sm" onclick="clockDone(true)">ยกเลิกปิดรอบ</button>' : ''));
  }
  var cid = cls + '|' + html;
  if (el.dataset.v === cid) return;
  el.dataset.v = cid; el.className = 'clock ' + cls; el.innerHTML = html;
}
function clockStart() { enqueue('startClock', { sessionId: B.sessionId }, applyState); B.state.session.startAt = now(); tickClock(); }
function clockDone(undoIt) {
  var go = function () {
    enqueue('markOnTimeDone', { sessionId: B.sessionId, undo: !!undoIt }, applyState);
    B.state.session.onTimeEndAt = undoIt ? null : now(); if (!B.state.session.startAt) B.state.session.startAt = now();
    if (undoIt) B.state.session.boardCode = '';
    tickClock(); toast(undoIt ? 'ยกเลิกแล้ว' : 'ปิดรอบตรงเวลา — คนมาสายกรอกรหัสบนกระดาน');
    if (!undoIt) { var q = $('#qrc'); if (q) q.remove(); boardShow(); }
  };
  if (undoIt) go(); else confirmBox('เช็คเสร็จแล้ว?', 'หลังจากนี้คนที่เพิ่งมาจะถูกบันทึกเป็น <b>สายรอบ 1</b> และเมื่อเกิน ' + (B.state.session.late2Minutes || 10) + ' นาทีหลังเริ่มเช็คชื่อ จะเป็น <b>สายรอบ 2</b><br>ระบบจะขึ้น <b>รหัสบนกระดาน</b> ให้คนมาสายกรอก', 'ยืนยัน', go);
}

function applyFilter() {

/* ---------- เช็คชื่อ ---------- */
function setAtt(id, status, manual) {
  var a = attMap()[id], prev = a ? { status: a.status, time: a.time } : { status: '', time: null };
  var t = now();
  if (!B.state.session.startAt && sessionOpen()) { B.state.session.startAt = t; }
  var s = B.state.session, st = status;
  if (st === 'AUTO') {
    var onEnd = s.onTimeEndAt || ((s.startAt || t) + (s.lateMinutes || 15) * 60000);
    st = !sessionOpen() ? 'P' : t <= onEnd ? 'P' : (t > s.startAt + (s.late2Minutes || 10) * 60000 ? 'M' : 'L');

function pickEligible(s, am) {

}

  var sv = B.sv, total = sv.sessions.filter(function (s) { return s.status === 'closed'; }).length;
  var h = '<div class="row"><div class="sub grow">คาบที่ปิดแล้ว ' + total + ' คาบ · สาย 2 นับเวลาเรียนครึ่งคาบ · แถวสีแดง = เวลาเรียนต่ำกว่า 80% (เสี่ยง มส.)</div><button class="btn sm" id="cp">คัดลอกไป Excel</button></div>';
  h += '<div class="card scroll"><table class="tbl"><thead><tr><th>ที่</th><th>ชื่อ</th><th>มา</th><th>สาย1</th><th>สาย2</th><th>ลา</th><th>กิจกรรม</th><th>ขาด</th><th>%</th><th>พฤติกรรม</th></tr></thead><tbody>';
  var rows = [['เลขที่', 'ชื่อ', 'นามสกุล', 'มา', 'สาย1', 'สาย2', 'ลา', 'กิจกรรม', 'ขาด', 'เวลาเรียน%', 'พฤติกรรม']];
  sv.students.forEach(function (s) {
    var x = sv.stats[s.id] || {};
    var risk = x.pct != null && x.pct < 80;
    h += '<tr class="' + (risk ? 'risk' : '') + '"><td>' + esc(s.no || '') + '</td><td>' + esc(s.firstName + ' ' + s.lastName) + '</td><td>' + (x.P || 0) + '</td><td>' + (x.L || 0) + '</td><td>' + (x.M || 0) + '</td><td>' + ((x.S || 0) + (x.B || 0)) + '</td><td>' + (x.E || 0) + '</td><td>' + (x.A || 0) + '</td><td><b>' + (x.pct == null ? '–' : x.pct) + '</b></td><td>' + (x.behavior || 0) + '</td></tr>';
    rows.push([s.no, s.firstName, s.lastName, x.P || 0, x.L || 0, x.M || 0, (x.S || 0) + (x.B || 0), x.E || 0, x.A || 0, x.pct == null ? '' : x.pct, x.behavior || 0]);
  });
  h += '</tbody></table></div>';
  /* แบบสำรวจ */
  var sv2 = sv.surveys, done = Object.keys(sv2).length;
  var cnt = function (k) { var o = {}; Object.keys(sv2).forEach(function (id) { var v = sv2[id][k] || '-'; o[v] = (o[v] || 0) + 1; }); return Object.keys(o).map(function (v) { return esc(v) + ' ' + o[v]; }).join(' · '); };
  h += '<div class="card"><b>แบบสำรวจก่อนเรียน</b> <span class="sub">ตอบแล้ว ' + done + '/' + sv.students.length + '</span>' +
    (done ? '<div style="margin-top:6px">มือถือ: ' + cnt('phone') + '<br>อินเทอร์เน็ตที่บ้าน: ' + cnt('internet') + '</div><details style="margin-top:6px"><summary>ดูคำตอบรายคน</summary>' +
      sv.students.filter(function (s) { return sv2[s.id]; }).map(function (s) { var a = sv2[s.id]; return '<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b>' + esc(s.no + '. ' + s.firstName) + '</b> · ' + esc(a.phone) + ' · เน็ต ' + esc(a.internet) + '<br><span class="sub">เครื่องดนตรี: ' + esc(a.instruments || '-') + ' · อยากเรียน: ' + esc(a.interest || '-') + '</span></div>'; }).join('') + '</details>' : '') + '</div>';
  b.innerHTML = h;
  $('#cp').onclick = function () {
    var tsv = rows.map(function (r) { return r.join('\t'); }).join('\n');
    (navigator.clipboard ? navigator.clipboard.writeText(tsv) : Promise.reject()).then(function () { toast('คัดลอกแล้ว วางใน Excel ได้เลย'); })
      .catch(function () { modal('<h3>คัดลอกข้อความนี้</h3><textarea style="min-height:240px">' + esc(tsv) + '</textarea>'); });
  };
}
function renderHistory() {
  var b = $('#body'); b.className = '';
  var ss = B.sv.sessions;
  b.innerHTML = '<div class="card list">' + (ss.map(function (s) {
    var c = s.counts;
    return '<div class="it" data-s="' + s.id + '"><div class="grow"><b>' + esc(fmtDS(s.date)) + '</b> <span class="sub">' + fmtT(s.startAt) + '</span><div class="sub">มา ' + c.P + ' · สาย ' + (c.L + c.M) + ' · ลา ' + (c.S + c.B) + ' · ขาด ' + c.A + '</div></div>' +
      (s.status === 'open' ? '<span class="chip" style="background:#dff5e7">กำลังสอน</span>' : s.status === 'cancelled' ? '<span class="chip">งดคาบ</span>' : '') + ' ›</div>';
  }).join('') || '<div class="empty">ยังไม่มีคาบเรียน</div>') + '</div>';
  $$('[data-s]', b).forEach(function (x) {
    x.onclick = function () {
      $$('#stabs .tab').forEach(function (t, i) { t.classList.toggle('on', i === 0); });
      B.mode = 'att'; boardInit(x.dataset.s);
    };
  });
}
function renderInfo() {
  var b = $('#body'); b.className = '';
  var c = B.sv.course;
  b.innerHTML = '<div class="sub">นักเรียนเห็นข้อมูลนี้ในแอป (ใช้ร่วมกันทุกห้องของวิชานี้)</div>' +
    '<label class="f">โครงสร้างรายวิชา / หน่วยการเรียนรู้</label><textarea id="i1" style="min-height:160px">' + esc(c.infoStructure) + '</textarea>' +
    '<label class="f">ข้อตกลงในชั้นเรียน</label><textarea id="i2" style="min-height:200px">' + esc(c.infoRules) + '</textarea>' +
    '<label class="f">เกณฑ์การให้คะแนน</label><textarea id="i3" style="min-height:120px">' + esc(c.infoGrading) + '</textarea>' +
    '<div style="height:12px"></div><button class="btn pri big" id="isv">บันทึก</button>' +
    '<div class="card"><b>ลิงก์ QR เข้าระบบของห้องนี้</b><div style="height:8px"></div><button class="btn" id="jq">▦ แสดง QR เข้าระบบ</button> <button class="btn" id="mr">จัดการรายชื่อ</button></div>';
  $('#isv').onclick = function () {
    var btn = this; btn.disabled = true;
    T('saveCourse', { id: c.id, name: c.name, code: c.code, color: c.color, infoStructure: $('#i1').value, infoRules: $('#i2').value, infoGrading: $('#i3').value })
      .then(function (r) { B.sv.course = r; toast('บันทึกแล้ว'); btn.disabled = false; }).catch(function (e) { toast(errMsg(e)); btn.disabled = false; });
  };
  $('#jq').onclick = function () { joinQR(B.sv.classroom.id, B.sv.classroom.name); };
  $('#mr').onclick = function () { tClassroom(B.sv.classroom.id, function () { tSection(B.secId, 'info'); }); };
}

/* =========================================================
   ===================== STUDENT ===========================
   ========================================================= */
function sLanding() {
  app('<div class="res"><div style="font-size:56px">🎵</div><h2>ระบบวิชาเรียน</h2><p>สแกน QR ของห้องเรียนเพื่อเข้าสู่ระบบ</p><p class="sub" style="margin-top:40px"><a href="' + esc(link({ p: 'teacher' })) + '">สำหรับครู</a></p></div>');
}
/* เลือกชื่อ + PIN ; after(): ทำต่อหลังล็อกอิน */
function sJoin(classroomId, after) {
  app('<div class="top"><h1>เข้าสู่ระบบ</h1></div><div id="body" class="empty">กำลังโหลดรายชื่อ…</div>');
  call('classroomPublic', { classroomId: classroomId }).then(function (r) {
    var b = $('#body'); b.className = '';
    b.innerHTML = '<div class="card"><b>ห้อง ' + esc(r.classroom.name) + '</b><div class="sub">แตะชื่อของตัวเอง</div><div style="height:8px"></div><input type="search" id="q" placeholder="ค้นหาเลขที่หรือชื่อ"></div><div class="card list" id="ls"></div>';
    var draw = function () {
      var q = $('#q').value.trim();
      $('#ls').innerHTML = r.students.filter(function (s) { return !q || String(s.no) === q || (s.firstName + s.lastName + s.nick).indexOf(q) >= 0; }).map(function (s) {
        return '<div class="it" data-id="' + s.id + '"><b style="width:30px;color:var(--muted)">' + esc(s.no || '') + '</b><div class="grow">' + esc(s.firstName + ' ' + s.lastName) + (s.nick ? ' <span class="sub">(' + esc(s.nick) + ')</span>' : '') + '</div>' + (s.hasPin ? '' : '<span class="chip" style="background:#fff3d6">ครั้งแรก</span>') + '</div>';
      }).join('') || '<div class="empty">ไม่พบชื่อ ให้แจ้งครู</div>';
      $$('#ls .it').forEach(function (x) { x.onclick = function () { sPin(r.students.filter(function (s) { return s.id === x.dataset.id; })[0], classroomId, after); }; });
    };
    $('#q').oninput = draw; draw();
  }).catch(function (e) { $('#body').textContent = errMsg(e); });
}
function sPin(s, classroomId, after) {
  var first = !s.hasPin;
  app('<div class="top"><button class="btn sm" id="bk">←</button><h1>' + esc(s.firstName) + '</h1></div><div class="card" style="max-width:420px;margin:20px auto;text-align:center">' +
    (first ? '<label class="f" style="text-align:left">ชื่อเล่น</label><input type="text" id="nk" maxlength="20" autocomplete="off" placeholder="ชื่อเล่นของเรา" value="' + esc(s.nick || '') + '"><div style="height:10px"></div>' : '') +
    '<h3>' + (first ? 'ตั้ง PIN 4 หลัก (จำไว้ใช้ทุกครั้ง)' : 'ใส่ PIN 4 หลัก') + '</h3>' +
    '<input type="password" id="p1" class="pin" inputmode="numeric" maxlength="4" autocomplete="off">' +
    (first ? '<label class="f">ใส่ PIN อีกครั้ง</label><input type="password" id="p2" class="pin" inputmode="numeric" maxlength="4" autocomplete="off">' : '') +
    '<div style="height:12px"></div><button class="btn pri big" id="go">ยืนยัน</button><p class="sub">ลืม PIN? แจ้งครูให้รีเซ็ต</p></div>');
  $('#bk').onclick = function () { sJoin(classroomId, after); };
  (first ? $('#nk') : $('#p1')).focus();
  $('#go').onclick = function () {
    var p = $('#p1').value, nk = first ? $('#nk').value.trim() : '';
    if (first && !nk) return toast('ใส่ชื่อเล่นก่อน');
    if (!/^\d{4}$/.test(p)) return toast('PIN ต้องเป็นตัวเลข 4 หลัก');
    if (first && p !== $('#p2').value) return toast('PIN สองช่องไม่ตรงกัน');
    var btn = this; btn.disabled = true;
    call('studentLogin', { studentId: s.id, pin: p, nick: nk }).then(function (r) {
      S.sTok = r.token; ls('sTok', r.token);
      if (after) after(); else sHome();
    }).catch(function (e) { toast(errMsg(e)); btn.disabled = false; });
  };
}
function sLogout() { S.sTok = null; ls('sTok', null); sLanding(); }

var SH = null;
function sHome() {
  app('<div class="top"><h1>ระบบวิชาเรียน</h1><button class="btn sm" onclick="sLogout()">ออก</button></div><div id="body" class="empty">กำลังโหลด…</div>');
  SX('studentHome').then(function (r) {
    SH = r;
    var st = r.student, b = $('#body'); b.className = '';
    var h = '<div class="card"><div style="font-size:20px;font-weight:700">สวัสดี ' + esc(st.nick || st.firstName) + '</div><div class="sub">' + esc(st.firstName + ' ' + st.lastName) + ' · ห้อง ' + esc(r.classroom.name) + ' · เลขที่ ' + esc(st.no || '') + '</div></div>';
    r.courses.forEach(function (c) {
      if (c.boardOpen) h += '<div class="card" style="background:#fff3d6;cursor:pointer" onclick="sBoard()"><b>⏱ มาสาย? กรอกรหัสบนกระดาน</b><div class="sub">' + esc(c.name) + ' · ดูรหัส 4 หลักบนจอครู แล้วแตะที่นี่</div></div>';
    });
    if (!r.surveyDone) h +='<div class="card" style="background:#fff8e5;cursor:pointer" onclick="sSurvey()"><b>📝 ทำแบบสำรวจก่อนเรียน</b><div class="sub">ใช้เวลา 1 นาที แตะเพื่อเริ่ม</div></div>';
    r.courses.forEach(function (c, i) {
      var p = c.stats.pct, col = p == null ? 'var(--N)' : p < 80 ? 'var(--A)' : 'var(--P)';
      h += '<div class="card" style="cursor:pointer;border-left:6px solid ' + esc(c.color) + '" onclick="sCourse(' + i + ')"><div class="row"><b class="grow">' + esc(c.name) + '</b><span>›</span></div>' +
        '<div class="sub">เวลาเรียน ' + (p == null ? 'ยังไม่มีข้อมูล' : p + '%') + ' · มา ' + (c.stats.P + c.stats.L + c.stats.M) + '/' + c.stats.total + ' คาบ</div>' +
        '<div class="bar-pct"><i style="width:' + (p || 0) + '%;background:' + col + '"></i></div></div>';
    });
    if (!r.courses.length) h += '<div class="card empty">ยังไม่มีรายวิชา</div>';
    h += '<details class="card"><summary>วิธีเพิ่มแอปไว้หน้าจอหลัก</summary><p><b>iPhone:</b> กดปุ่มแชร์ (สี่เหลี่ยมมีลูกศร) → "เพิ่มไปยังหน้าจอโฮม"<br><b>Android:</b> กด ⋮ มุมขวาบน → "เพิ่มลงในหน้าจอหลัก"</p></details>';
    b.innerHTML = h;
  }).catch(function (e) { if (errMsg(e) === 'AUTH') return sLanding(); $('#body').textContent = errMsg(e); });
}
function sCourse(i, tab) {
  var c = SH.courses[i]; tab = tab || 'info';
  var h = '<div class="top"><button class="btn sm" onclick="sHome()">←</button><h1>' + esc(c.name) + '</h1></div><div class="tabs">' +
    [['info', 'ข้อมูลรายวิชา'], ['att', 'การเข้าเรียนของฉัน']].map(function (t) { return '<button class="tab' + (t[0] === tab ? ' on' : '') + '" onclick="sCourse(' + i + ',\'' + t[0] + '\')">' + t[1] + '</button>'; }).join('') + '</div>';
  if (tab === 'info') {
    h += '<div class="card"><b>โครงสร้างรายวิชา</b><div class="pre">' + esc(c.infoStructure) + '</div></div>' +
      '<div class="card"><b>ข้อตกลงในชั้นเรียน</b><div class="pre">' + esc(c.infoRules) + '</div></div>' +
      '<div class="card"><b>เกณฑ์การให้คะแนน</b><div class="pre">' + esc(c.infoGrading) + '</div></div>';
  } else {
    var s = c.stats;
    h += '<div class="card"><div style="font-size:28px;font-weight:700">' + (s.pct == null ? '–' : s.pct + '%') + '</div><div class="sub">เวลาเรียน (ต้องไม่ต่ำกว่า 80%)</div>' +
      '<div class="row" style="margin-top:8px">' + ['P', 'L', 'M', 'S', 'B', 'E', 'A'].filter(function (k) { return s[k]; }).map(function (k) { return '<span class="pill" style="background:' + ST[k].c + '">' + ST[k].t + ' ' + s[k] + '</span>'; }).join('') + '</div></div>';
    h += '<div class="card list">' + (c.history.map(function (x) {
      var k = x.status || '';
      return '<div class="it" style="cursor:default"><div class="grow">' + esc(fmtDS(x.date)) + (x.open ? ' <span class="sub">(กำลังเรียน)</span>' : '') + '</div>' +
        (x.behavior ? '<span class="sub">' + (x.behavior > 0 ? '+' : '') + x.behavior + '</span>' : '') +
        '<span class="pill" style="background:' + ST[k].c + '">' + ST[k].t + (x.time && (k === 'L' || k === 'M') ? ' ' + fmtT(x.time) : '') + '</span></div>';
    }).join('') || '<div class="empty">ยังไม่มีคาบเรียน</div>') + '</div>';
  }
  app(h);
}
function sSurvey() {
  var q = function (k, label, opts) {
    return '<label class="f">' + label + '</label><div class="opts">' + opts.map(function (o) { return '<div class="opt" data-q="' + k + '" data-v="' + esc(o) + '">' + esc(o) + '</div>'; }).join('') + '</div>';
  };
  app('<div class="top"><button class="btn sm" onclick="sHome()">←</button><h1>แบบสำรวจก่อนเรียน</h1></div><div class="card">' +
    q('phone', '1. มีมือถือที่ใช้ในห้องเรียนได้ไหม', ['มีของตัวเอง', 'ใช้ร่วมกับคนในบ้าน', 'ไม่มี']) +
    q('internet', '2. มีอินเทอร์เน็ตที่บ้านไหม', ['มี', 'บางครั้ง', 'ไม่มี']) +
    '<label class="f">3. เล่นเครื่องดนตรีอะไรได้บ้าง (ไม่มีก็ได้)</label><input type="text" id="ins" placeholder="เช่น กีตาร์ ขลุ่ย ร้องเพลง">' +
    '<label class="f">4. อยากเรียนอะไรในวิชานี้</label><input type="text" id="int">' +
    '<div style="height:14px"></div><button class="btn pri big" id="sv">ส่งแบบสำรวจ</button></div>');
  var ans = {};
  $$('[data-q]').forEach(function (o) {
    o.onclick = function () {
      ans[o.dataset.q] = o.dataset.v;
      $$('[data-q="' + o.dataset.q + '"]').forEach(function (x) { x.style.background = x === o ? 'var(--brand)' : '#fff'; x.style.color = x === o ? '#fff' : ''; });
    };
  });
  $('#sv').onclick = function () {
    if (!ans.phone || !ans.internet) return toast('ตอบข้อ 1 และ 2 ก่อน');
    ans.instruments = $('#ins').value.trim(); ans.interest = $('#int').value.trim();
    var b = this; b.disabled = true;
    SX('submitSurvey', { answers: ans }).then(function () { toast('ส่งแล้ว ขอบคุณ'); sHome(); }).catch(function (e) { toast(errMsg(e)); b.disabled = false; });
  };
}

/* ---------- เช็คชื่อด้วย QR ---------- */
function sCheckinStart(sessionId, t) {
  app('<div class="res"><h2>กำลังตรวจสอบ QR…</h2></div>');
  call('checkinTicket', { sessionId: sessionId, t: t }).then(function (tk) {
    var go = function () { sDoCheckin(tk); };
    if (S.sTok) go();
    else sJoin(tk.classroomId, go);
  }).catch(function (e) { sResult(false, errMsg(e)); });
}
function sDoCheckin(tk) {
  app('<div class="res"><h2>กำลังเช็คชื่อ…</h2></div>');
  SX('checkin', { sessionId: tk.sessionId, ticket: tk.ticket, issuedAt: tk.issuedAt }).then(function (r) {
    sResult(true, (r.already ? 'เช็คชื่อไว้แล้ว: ' : '') + ST[r.status].t + ' · ' + fmtT(r.time), r.status, tk.courseName + ' · ' + tk.classroomName);
  }).catch(function (e) {
    var m = errMsg(e);
    if (m === 'AUTH') return sJoin(tk.classroomId, function () { sDoCheckin(tk); });
    if (m.indexOf('ห้องอื่น') >= 0) return sResult(false, m, null, null, true, tk);
    sResult(false, m);
  });
}
/* ---------- รหัสบนกระดาน (คนมาสาย) ---------- */
function sBoard() {
  app('<div class="top"><button class="btn sm" onclick="sHome()">←</button><h1>รหัสบนกระดาน</h1></div><div class="card" style="max-width:420px;margin:20px auto;text-align:center">' +
    '<h3>กรอกรหัส 4 หลักที่อยู่บนจอครู</h3><input type="text" id="bc" class="pin" inputmode="numeric" maxlength="4" autocomplete="off">' +
    '<div style="height:12px"></div><button class="btn pri big" id="go">ส่งรหัส</button><p class="sub">ถ้ารหัสไม่ผ่าน ให้ดูรหัสล่าสุดบนจอ ครูอาจเพิ่งเปลี่ยน</p></div>');
  var inp = $('#bc'); inp.focus();
  inp.oninput = function () { inp.value = inp.value.replace(/\D/g, '').slice(0, 4); };
  inp.onkeydown = function (e) { if (e.key === 'Enter') $('#go').click(); };
  $('#go').onclick = function () {
    var code = inp.value;
    if (!/^\d{4}$/.test(code)) return toast('ใส่ตัวเลขให้ครบ 4 หลัก');
    var btn = this; btn.disabled = true;
    SX('boardCheckin', { code: code }).then(function (r) {
      sResult(true, (r.already ? 'เช็คชื่อไว้แล้ว: ' : '') + ST[r.status].t + ' · ' + fmtT(r.time), r.status, r.courseName);
    }).catch(function (e) {
      if (errMsg(e) === 'AUTH') return sLanding();
      toast(errMsg(e), 3500); btn.disabled = false; inp.value = ''; inp.focus();
    });
  };
}
function sResult(ok, msg, status, sub, switchUser, tk) {
  var col = ok ? ST[status || 'P'].c : 'var(--A)';
  app('<div class="res"><div class="ok" style="background:' + col + '">' + (ok ? '✓' : '!') + '</div><h2>' + esc(msg) + '</h2>' + (sub ? '<p class="sub">' + esc(sub) + '</p>' : '') +
    (switchUser ? '<button class="btn" id="sw">ไม่ใช่ฉัน / เปลี่ยนผู้ใช้</button><div style="height:10px"></div>' : '') +
    '<button class="btn pri" onclick="sHome()">ไปหน้าหลัก</button></div>');
  if (switchUser) $('#sw').onclick = function () { S.sTok = null; ls('sTok', null); sJoin(tk.classroomId, function () { sDoCheckin(tk); }); };
}

start();
</script>
